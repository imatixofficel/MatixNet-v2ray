name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Restore generated keystore (if any)
      id: ks_cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ks
        key: matixnet-generated-keystore-v1

    - name: Prepare Keystore
      id: android_keystore
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        S_STORE_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        S_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        S_KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        mkdir -p "$RUNNER_TEMP/ks"
        KS_FILE="$RUNNER_TEMP/ks/android_keystore.jks"
        GENERATED=false

        if [ -n "$KS_B64" ] && [ -n "$S_STORE_PASS" ] && [ -n "$S_ALIAS" ] && [ -n "$S_KEY_PASS" ]; then
          echo "Using keystore from GitHub Secrets"
          printf '%s' "$KS_B64" | base64 -d > "$KS_FILE"
          STORE_PASS="$S_STORE_PASS"; KEY_ALIAS="$S_ALIAS"; KEY_PASS="$S_KEY_PASS"
        else
          echo "Secrets are not set -> using a self-generated keystore"
          STORE_PASS="matixnet123"; KEY_ALIAS="matixnet"; KEY_PASS="matixnet123"
          if [ ! -f "$KS_FILE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$KS_FILE" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=MatixNet, OU=Matix, O=Matix, C=IR"
            GENERATED=true
          fi
        fi

        echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
        echo "SIGN_FILE=$KS_FILE" >> "$GITHUB_ENV"
        echo "SIGN_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
        echo "SIGN_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
        echo "SIGN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

    - name: Save generated keystore
      if: steps.android_keystore.outputs.generated == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ks
        key: matixnet-generated-keystore-v1

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$SIGN_FILE" \
          -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
          -Pandroid.injected.signing.key.alias="$SIGN_ALIAS" \
          -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
